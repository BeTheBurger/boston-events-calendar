name: Update Boston Event Feeds

on:
  schedule:
    # Runs at 8:00 AM EDT (12:00 UTC) every Sunday, Wednesday, and the 1st of every month
    - cron: '0 12 * * 0,3'
    - cron: '0 12 1 * *'
  workflow_dispatch: # Allows manual one-click trigger from GitHub UI

jobs:
  update-feeds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run calendar generator
        run: python generate_calendars.py

      - name: Commit and push updated .ics files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.ics
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update event calendars [skip ci]" && git push)
